x-application: &application
  build:
    context: .
  image: staff-bot-app:local
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-staff_bot}
    POSTGRES_USER: ${POSTGRES_USER:-staff_bot}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: ${REDIS_DB:-0}
    CLUB_TIMEZONE: ${CLUB_TIMEZONE:-Europe/Moscow}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    OWNER_PANEL_BANNER_FILE_ID: ${OWNER_PANEL_BANNER_FILE_ID:-}
    ADMIN_PANEL_BANNER_FILE_ID: ${ADMIN_PANEL_BANNER_FILE_ID:-}
    TRAINER_PANEL_BANNER_FILE_ID: ${TRAINER_PANEL_BANNER_FILE_ID:-}
    ATHLETE_PANEL_BANNER_FILE_ID: ${ATHLETE_PANEL_BANNER_FILE_ID:-}
    ROLE_SELECTOR_BANNER_FILE_ID: ${ROLE_SELECTOR_BANNER_FILE_ID:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *application
    command:
      - uvicorn
      - entrypoints.api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  bot:
    <<: *application
    command: ["python", "-m", "entrypoints.bot"]

  celery-worker:
    <<: *application
    command:
      - celery
      - --app
      - entrypoints.celery:app
      - worker
      - --loglevel=INFO

  celery-beat:
    <<: *application
    command:
      - celery
      - --app
      - entrypoints.celery:app
      - beat
      - --loglevel=INFO

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staff_bot}
      POSTGRES_USER: ${POSTGRES_USER:-staff_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
