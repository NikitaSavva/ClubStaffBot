x-application: &application
  build:
    context: .
  image: staff-bot-app:local
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-staff_bot}
    POSTGRES_USER: ${POSTGRES_USER:-staff_bot}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: ${REDIS_DB:-0}
    CLUB_TIMEZONE: ${CLUB_TIMEZONE:-Europe/Moscow}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    TELEGRAM_WEBAPP_BASE_URL: ${TELEGRAM_WEBAPP_BASE_URL:?Set TELEGRAM_WEBAPP_BASE_URL in .env}
    TELEGRAM_WEBAPP_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_WEBAPP_INIT_DATA_MAX_AGE_SECONDS:-3600}
    ATHLETE_QR_SIGNING_SECRET: ${ATHLETE_QR_SIGNING_SECRET:?Set ATHLETE_QR_SIGNING_SECRET in .env}
    ATHLETE_QR_TTL_SECONDS: ${ATHLETE_QR_TTL_SECONDS:-300}
    OWNER_PANEL_BANNER_FILE_ID: ${OWNER_PANEL_BANNER_FILE_ID:-}
    ADMIN_PANEL_BANNER_FILE_ID: ${ADMIN_PANEL_BANNER_FILE_ID:-}
    TRAINER_PANEL_BANNER_FILE_ID: ${TRAINER_PANEL_BANNER_FILE_ID:-}
    ATHLETE_PANEL_BANNER_FILE_ID: ${ATHLETE_PANEL_BANNER_FILE_ID:-}
    ROLE_SELECTOR_BANNER_FILE_ID: ${ROLE_SELECTOR_BANNER_FILE_ID:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *application
    command:
      - uvicorn
      - entrypoints.api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  bot:
    <<: *application
    command: ["python", "-m", "entrypoints.bot"]

  celery-worker:
    <<: *application
    command:
      - celery
      - --app
      - entrypoints.celery:app
      - worker
      - --loglevel=INFO

  celery-beat:
    <<: *application
    command:
      - celery
      - --app
      - entrypoints.celery:app
      - beat
      - --loglevel=INFO

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staff_bot}
      POSTGRES_USER: ${POSTGRES_USER:-staff_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
