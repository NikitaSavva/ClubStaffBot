[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
]

[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
strict = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
